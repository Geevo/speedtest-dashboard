<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f6f7" />
    <meta name="description" content="Backend-originated network identity and speed testing." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <title>Speedtest Dashboard</title>
    <script>
      try {
        const theme = localStorage.getItem('speedtest-dashboard-theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
