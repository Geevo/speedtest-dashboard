name: speedtest-dashboard

services:
  speedtest-dashboard:
    image: ${SPEEDTEST_DASHBOARD_IMAGE:?Set SPEEDTEST_DASHBOARD_IMAGE to a published image tag}
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - speedtest-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  speedtest-data:
