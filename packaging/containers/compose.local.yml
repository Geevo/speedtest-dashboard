name: speedtest-dashboard

services:
  speedtest-dashboard:
    build:
      context: ../..
      dockerfile: packaging/containers/Dockerfile
      args:
        APP_VERSION: "${APP_VERSION:-}"
        SOURCE_REVISION: "${SOURCE_REVISION:-unknown}"
        INSTALL_OOKLA: "${INSTALL_OOKLA:-false}"
    image: ${SPEEDTEST_DASHBOARD_IMAGE:-speedtest-dashboard:local}
    ports:
      - "${DASHBOARD_PORT:-8080}:${DASHBOARD_PORT:-8080}"
    volumes:
      - speedtest-data:/data
    environment:
      DASHBOARD_PORT: "${DASHBOARD_PORT:-8080}"
      Providers__Ookla__AcceptLicense: "${OOKLA_ACCEPT_LICENSE:-false}"
      Providers__Ookla__AcceptGdpr: "${OOKLA_ACCEPT_GDPR:-false}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  speedtest-data:
