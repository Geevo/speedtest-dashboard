services:
  speedtest-dashboard:
    build:
      context: .
      args:
        INSTALL_OOKLA: "false"
    image: speedtest-dashboard:local
    ports:
      - "8080:8080"
    volumes:
      - speedtest-data:/data
    environment:
      Authentication__AllowInsecureHttp: "true"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  speedtest-data:
